name: Error
description: Algo no funciona como se espera
title: "fix: "
labels: ["tipo:fix"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Mensajes de error o capturas
      render: shell
