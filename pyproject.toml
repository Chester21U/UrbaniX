[project]
name = "urbanix"
version = "0.0.1"
description = "Centro de Comando Cívico Inteligente: reporte, priorización y seguimiento de daños en la infraestructura urbana."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**", "ml/datasets", "ml/runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.format]
quote-style = "double"
